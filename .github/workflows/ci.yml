name: Backend CI
run-name: Backend CI / ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source for main
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            if [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "Pull requests into main must come from this repository's develop branch." >&2
              exit 1
            fi
            if [[ "$PR_HEAD_REF" != develop ]]; then
              echo "Pull requests into main must come from develop." >&2
              exit 1
            fi
          fi

  build-and-test:
    needs: source_policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Python release scripts (no external services)
        run: python3 scripts/release/test-deploy.py
      - name: Test integration shard planner
        run: python3 tests/ci/test_integration_shards.py -v
      - name: Test coverage gate
        run: python3 scripts/coverage/test_report.py -v
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate operational application service configuration
        run: docker compose --env-file /dev/null -f tests/fixtures/compose-operational-base.yaml -f compose.operacion.yaml --profile kafka config --no-interpolate --quiet
      - name: Restore backend
        run: dotnet restore NexoRuta.sln --locked-mode
      - name: Build backend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Test backend unit tests
        run: dotnet test tests/NexoRuta.UnitTests/NexoRuta.UnitTests.csproj --no-build --no-restore --configuration Release --logger trx --collect:"XPlat Code Coverage" --results-directory artifacts/unit
      - name: Test backend architecture
        run: dotnet test tests/NexoRuta.ArchitectureTests/NexoRuta.ArchitectureTests.csproj --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/architecture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-fast-test-results-${{ github.run_id }}
          path: |
            artifacts/**/*.trx
            artifacts/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: source_policy
    # MongoDB 8 refuses kernels 6.19–7.0.13 (SERVER-125742). The Jammy
    # hosted image uses the supported 6.8 HWE kernel; keep real MongoDB 8 tests.
    runs-on: ubuntu-22.04
    environment: nexoruta-ci
    defaults:
      run:
        working-directory: backend
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      NEXORUTA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/backend/tests/browser/node_modules/playwright
      NEXORUTA_RECEIPT_E2E_DIR: ${{ github.workspace }}/backend/artifacts/browser/receipt
      NEXORUTA_GEOCODING_FULLSTACK_DIR: ${{ github.workspace }}/backend/artifacts/browser/geocoding
      NEXORUTA_VEHICLES_E2E_DIR: ${{ github.workspace }}/backend/artifacts/browser/vehicles
      NEXORUTA_SESSION_E2E_DIR: ${{ github.workspace }}/backend/artifacts/browser/session
      NEXORUTA_GESTION_E2E_DIR: ${{ github.workspace }}/backend/artifacts/browser/management
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NexoRuta/NexoRuta-Frontend
          ref: 7ce3e969924e1157d2eaa80b5c933bea9560f5b0
          path: frontend
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            frontend/**/packages.lock.json
      - name: Restore and build backend
        run: |
          dotnet restore NexoRuta.sln --locked-mode
          dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Build the exact companion portals for Kestrel browser tests
        run: |
          dotnet restore ../frontend/NexoRuta.sln --locked-mode
          dotnet build ../frontend/NexoRuta.sln -c Release --no-restore -p:OfficialDepartmentSource="$PWD/src/ZonasCobertura/Data/departamentos-uruguay.geojson"
      - name: Install pinned Chromium for browser integration
        run: |
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Verify the critical operational decision flow first
        if: matrix.shard == 0
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: >-
          dotnet test tests/NexoRuta.IntegrationTests/NexoRuta.IntegrationTests.csproj
          -c Release --no-build --no-restore
          --filter FullyQualifiedName~BackofficeBrowserIniciaDecisionOperativaConConflictoYReintentoSeguro
          --logger "trx;LogFileName=critical-route-decision.trx"
          --results-directory artifacts/integration/critical
      - name: Run the verified integration shard
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: >-
          python3 tests/ci/integration_shards.py
          --test-project tests/NexoRuta.IntegrationTests/NexoRuta.IntegrationTests.csproj
          --results-directory artifacts/integration/shard-${{ matrix.shard }}
          --shard-index ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-integration-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            backend/artifacts/integration/**/*.trx
            backend/artifacts/integration/**/coverage.cobertura.xml
            backend/artifacts/browser/**
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Backend coverage / Domain and Application >70%
    if: always()
    needs: [build-and-test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-*-*-${{ github.run_id }}
          path: artifacts/coverage-input
      - name: Require coverage above 70% independently in each layer
        run: python3 scripts/coverage/report.py 'artifacts/coverage-input/**/coverage.cobertura.xml' --output artifacts/coverage-summary --minimum-reports 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage-summary-${{ github.run_id }}
          path: artifacts/coverage-summary/
          if-no-files-found: error
          retention-days: 14

  result:
    name: Backend CI / result
    if: always()
    needs: [source_policy, build-and-test, integration, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require the backend validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              print('Backend validation incomplete:', json.dumps(failed, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          PY
