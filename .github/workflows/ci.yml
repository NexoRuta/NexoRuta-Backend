name: Backend CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nexoruta
          POSTGRES_USER: nexoruta
          POSTGRES_PASSWORD: nexoruta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexoruta -d nexoruta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXORUTA_TEST_POSTGRES: Host=localhost;Port=5432;Database=nexoruta;Username=nexoruta;Password=nexoruta_dev
    steps:
      - name: Validate PR source
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$PR_HEAD_REF" != "develop" || "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "This workflow only accepts PRs from develop in the same repository." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore backend
        run: dotnet restore NexoRuta.sln
      - name: Build backend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Test backend (unit and PostgreSQL integration)
        run: dotnet test NexoRuta.sln --no-build --configuration Release --logger "console;verbosity=normal"
