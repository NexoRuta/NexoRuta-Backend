name: Backend CI
run-name: Backend CI / ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source for main
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            if [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "Pull requests into main must come from this repository's develop branch." >&2
              exit 1
            fi
            if [[ "$PR_HEAD_REF" != develop ]]; then
              echo "Pull requests into main must come from develop." >&2
              exit 1
            fi
          fi

  build-and-test:
    needs: source_policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Python release scripts (no external services)
        run: python3 scripts/release/test-deploy.py
      - name: Test integration shard planner
        run: python3 tests/ci/test_integration_shards.py -v
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore backend
        run: dotnet restore NexoRuta.sln --locked-mode
      - name: Build backend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Test backend unit tests
        run: dotnet test tests/NexoRuta.UnitTests/NexoRuta.UnitTests.csproj --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/unit
      - name: Test backend architecture
        run: dotnet test tests/NexoRuta.ArchitectureTests/NexoRuta.ArchitectureTests.csproj --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/architecture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-fast-test-results-${{ github.run_id }}
          path: artifacts/**/*.trx
          if-no-files-found: error
          retention-days: 14

  integration:
    needs: source_policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and build backend
        run: |
          dotnet restore NexoRuta.sln --locked-mode
          dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Run the verified integration shard
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: >-
          python3 tests/ci/integration_shards.py
          --test-project tests/NexoRuta.IntegrationTests/NexoRuta.IntegrationTests.csproj
          --results-directory artifacts/integration/shard-${{ matrix.shard }}
          --shard-index ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-integration-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/integration/**/*.trx
          if-no-files-found: error
          retention-days: 14

  result:
    name: Backend CI / result
    if: always()
    needs: [source_policy, build-and-test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require the backend validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              print('Backend validation incomplete:', json.dumps(failed, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          PY
