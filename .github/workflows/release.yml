name: Notify NexoRuta integration / backend
run-name: Notify integration / backend / ${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    environment: nexoruta-demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dispatch this backend SHA to NexoRuta
        env:
          NEXORUTA_INTEGRATION_TOKEN: ${{ secrets.NEXORUTA_INTEGRATION_TOKEN }}
        run: python3 scripts/release/dispatch-integration.py
