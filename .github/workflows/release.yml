name: Integrated delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    environment: nexoruta-demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trigger the NexoRuta integration pipeline
        env:
          NEXORUTA_INTEGRATION_TOKEN: ${{ secrets.NEXORUTA_INTEGRATION_TOKEN }}
        run: python3 scripts/release/dispatch-integration.py
