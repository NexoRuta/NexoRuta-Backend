name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Do not cancel a running SSH transaction; VPS watermark and shared lock arbitrate deploys.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nexoruta-demo
    env:
      IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Create or verify immutable source tag
        shell: bash
        run: |
          set -euo pipefail
          tag="release-$GITHUB_SHA"
          verify() {
            git fetch --no-tags origin "refs/tags/$tag"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          }
          remote=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -z "$remote" ]]; then
            # A competing creator must still point at this exact commit.
            git push origin "$GITHUB_SHA:refs/tags/$tag" || verify
          fi
          verify
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.NEXORUTA_IMAGE_PLATFORM }}
          push: true
          tags: ghcr.io/nexoruta/nexoruta-api:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Deploy owned services over SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.NEXORUTA_VPS_HOST }}
          VPS_PORT: ${{ vars.NEXORUTA_VPS_PORT }}
          VPS_USER: ${{ vars.NEXORUTA_VPS_USER }}
          DEPLOY_DIR: ${{ vars.NEXORUTA_VPS_DEPLOY_DIR }}
          PULL_USER: ${{ vars.NEXORUTA_GHCR_PULL_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.NEXORUTA_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NEXORUTA_VPS_KNOWN_HOSTS }}
          PULL_TOKEN: ${{ secrets.NEXORUTA_GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ &&
             "$VPS_PORT" =~ ^[0-9]{1,5}$ &&
             "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ &&
             "$DEPLOY_DIR" == /* && -n "$PULL_USER" && -n "$PULL_TOKEN" ]]
          (( 10#$VPS_PORT > 0 && 10#$VPS_PORT <= 65535 ))
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          # Quote every input as shell data; credentials never enter argv or logs.
          {
            printf 'export NEXORUTA_PULL_TOKEN=%q\n' "$PULL_TOKEN"
            printf 'set --'
            printf ' %q' "$DEPLOY_DIR" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" \
              "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$IMAGE_TAG" "$PULL_USER"
            printf '\n'
            cat scripts/release/deploy.sh
          } | ssh -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -s'

